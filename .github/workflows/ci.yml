name: ci

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  # Marking a pre-release as a release (or publishing one) rebuilds the website against it.
  release:
    types: [released]
  workflow_dispatch:
  schedule:
    - cron: "30 15 * * *" # daily (UTC)

# The repository's own jobs run this checkout's code with a read-only token. The write grants
# sit on the job that calls the shared workflow, whose release and Pages jobs alone use them;
# its build legs, which run this code too, narrow their token to read-only themselves.
permissions:
  contents: read

jobs:
  app:
    uses: daybrite/actions/.github/workflows/dayapp.yml@v1
    permissions:
      contents: write # release-asset upload on tag builds
      pages: write    # web-dom → GitHub Pages (deploy-web)
      id-token: write # deploy-pages OIDC token (deploy-web)
    secrets: inherit
    with:
      targets: windows-winui, macos-appkit, linux-gtk, linux-qt, ios-uikit, android-mdc, harmony-arkui, web-dom
      # Named rather than "auto": the other dayscript, prefs-window.yaml, drives the desktop
      # Preferences window, which the mobile targets in this matrix have no equivalent of.
      scripts: dayscript/walkthrough.yaml
      launch-env: TRADER_MOCK=1
      #locales: en fr ar zh-CN

      # publish as pre-release
      release-mode: pre-release

      # Publish the web build to GitHub Pages on every push to main (empty tag-pattern → the
      # default-branch mode). Native release assets still attach on vX.Y.Z tags, independently.
      deploy-web: true

  # The bundled demo data, read through each target's own packaging: `day::resource` out of the
  # app bundle on macOS, `assets/data/demo/` over the page's own origin on web-dom. The unit test
  # parses those files from the source tree, which leaves the packaging itself unchecked; this is
  # what catches a change that stops shipping them, or that loses the `GC=F` → `GC_F.json` rewrite.
  #
  # Its own call rather than a second script on the job above, because `launch-env` applies to
  # every scripted launch in a job and the `TRADER_MOCK=1` there outranks the demo source. One
  # locale and no screenshots: every scripted run uploads `screenshots-<target>`, so a second run
  # of the same target in one workflow run would claim an artifact name that already exists.
  #
  # Not on tags: the release job attaches whatever a call packs, and this call's packages would
  # land on the release beside the ones the job above built.
  demo-data:
    if: github.ref_type != 'tag'
    uses: daybrite/actions/.github/workflows/dayapp.yml@v1
    with:
      # The two packaging paths that differ. Add android-mdc or ios-uikit here to cover theirs.
      targets: macos-appkit, web-dom
      scripts: dayscript/demo-data.yaml
      launch-env: TRADER_DEMO=1
      # Keeps this call's packages from colliding with the job above's `dist-<target>`.
      artifact-prefix: demo-
      # The job above deploys the site; a second deploy in the same run uploads a second Pages
      # artifact, and whichever deploys last fails on the duplicate after the other published a
      # site built from this call's artifacts.
      deploy-website: "false"
      # Both already ran in the job above, on the same commit.
      lint: false
      preflight-checks: ""
