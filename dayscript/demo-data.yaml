# Day Trader's bundled demo data (https://daybrite.dev/docs/dayscript).
#
# Run with the demo switch on and the mock off, so every quote below comes out of the app's own
# bundle instead of the network:
#
#     day launch -t macos-appkit --env TRADER_DEMO=1 --script dayscript/demo-data.yaml
#
# What this covers that a unit test cannot: `every_preset_has_bundled_demo_data` parses the
# committed files from the source tree, while this reads them through the packaged bundle:
# `day::resource` on a native target, `assets/data/demo/` over the page's own origin on web-dom.
# Those are the two paths a packaging change can break without touching a line of Rust.
#
# No `screenshot:` steps. The gallery is the mock walkthrough's, and every scripted
# run uploads its captures as `screenshots-<target>`: a second run of the same target in one CI
# run would claim an artifact name that already exists.
name: day-trader-demo-data
description: The bundled snapshots, read through each target's own bundle.
flow:
  - wait_for: { id: nav }
  - wait_for: { id: watchlist_title }
  # The source strip, and the notice every page carries while the data is not live.
  - assert_text: { id: data_source, key: data_demo }
  - wait_for: { id: demo_notice }
  - assert_text: { id: demo_notice, key: demo_notice_chosen }
  # Symbols are reached by row, never by symbol route: a symbol is a top-level route only in the
  # desktop sidebar, and the phone shell pushes it onto the owning tab's stack instead, so a
  # `route:` step finds nothing there (walkthrough.yaml says the same at more length).
  - tap: { id: wl_row:SPY }
  - wait_for: { id: detail_price }
  - assert_text: { id: detail_symbol, text: "SPY" }
  # The name comes from the snapshot's own `meta.shortName`, which is what tells the bundled file
  # apart from the generator: the mock names SPY "SPDR S&P 500 ETF" out of the static catalog in
  # src/quotes.rs. Asserting a name rather than a price keeps this script free of float
  # formatting, so it holds on wasm and every native architecture alike.
  - assert_text: { id: detail_name, text: "State Street SPDR S&P 500 ETF T" }
  # A load that fails renders an error in place of the chart, so its absence is the evidence the
  # file was found, parsed, and had bars in it.
  - assert_missing: { id: detail_error }
  # Back first, then the section: on a phone the detail was pushed onto the tab's stack, and
  # selecting the tab again would leave it on top with the rows covered underneath.
  - nav_back:
  - navigate: { route: watchlist }
  # `GC=F` is the case worth checking. Its file is committed as `GC_F.json`, because `=` is
  # awkward in a repository path, a URL and an Android asset name alike, so a packaging change
  # that loses that rewrite fails here and nowhere else.
  - tap: { id: "wl_row:GC%3DF" }
  - wait_for: { id: detail_price }
  - assert_text: { id: detail_symbol, text: "GC=F" }
  - assert_text: { id: detail_name, text: "Gold Dec 26" }
  - assert_missing: { id: detail_error }
  - nav_back:
  - navigate: { route: watchlist }
  # A third symbol, so this proves per-symbol resolution rather than one hard-coded read.
  - tap: { id: wl_row:DIA }
  - wait_for: { id: detail_price }
  - assert_text: { id: detail_symbol, text: "DIA" }
  - assert_text: { id: detail_name, text: "State Street SPDR Dow Jones Ind" }
  - assert_missing: { id: detail_error }
  - nav_back:
  - navigate: { route: watchlist }
  # The demo switch lives in the Data group of the settings surface. Present, not asserted for
  # a value: it reflects the persisted setting, which `TRADER_DEMO=1` leaves alone.
  - navigate: { route: settings }
  - wait_for: { id: settings_root }
  - tap: { id: prefs_group:data }
  - wait_for: { id: demo_toggle }
