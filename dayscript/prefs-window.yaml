name: trader-prefs-window
description: The Preferences window (https://daybrite.dev/docs/settings, desktop combos;
  TRADER_MOCK=1) — the auto Settings… menu action opens the shared surface as a singleton
  window, on its General page.
flow:
  - wait_for: { id: watchlist-title }
  - menu: { key: day-preferences }
  - wait_for: { id: language-picker }
  - screenshot: { name: prefs-window, window: day.preferences }
  - close_window: { window: day.preferences }
